format_version = 1
id = "super-metroid.pacing"
version = "1.0.0"
name = "Super Metroid Pacing"
author = "SuperMetroidRecomp contributors"
description = "Shorter waits: faster elevators and more. Each feature is a separate switch. Ideas from Super Metroid Redux (ShadowOne333), Project Base (Begrimed) and Ancient Chozo, reimplemented for the stock game."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "supermetroid-jpn"
rom_sha256 = "12b77c4bc9c1832cee8881244659065ee1d84c70c3d29e6eaf92e6798cc2ca72"

[[feature]]
id = "elevators"
name = "Faster elevators"
description = "Elevators travel faster between areas. Inspired by Super Metroid Redux."
group = "Pacing"
default_enabled = false

[[option]]
feature = "elevators"
id = "speed"
label = "Speed"
description = "Ride speed compared with the original game."
type = "choice"
default = "2x"
[[option.choice]]
value = "2x"
label = "2x"
[[option.choice]]
value = "3x"
label = "3x"

[[plugin]]
feature = "elevators"
id = "super-metroid.pacing.elevators"
