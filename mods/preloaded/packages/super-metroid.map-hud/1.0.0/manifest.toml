format_version = 1
id = "super-metroid.map-hud"
version = "1.0.0"
name = "Super Metroid Map and HUD"
author = "SuperMetroidRecomp contributors"
description = "Map views and HUD readouts with individual switches. The maps use the game's own rooms, doors and discovery data."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "supermetroid-jpn"
rom_sha256 = "12b77c4bc9c1832cee8881244659065ee1d84c70c3d29e6eaf92e6798cc2ca72"

[[feature]]
id = "pause-stats"
name = "Play time and item percentage"
description = "The pause screens show your play time and item collection percentage. Inspired by Super Metroid Redux (counters by PHOSPHOTiDYL)."
group = "HUD"
default_enabled = false
presentation_only = true

[[plugin]]
feature = "pause-stats"
id = "super-metroid.map-hud.pause-stats"

[[feature]]
id = "ammo-totals"
name = "Pause ammo capacity"
description = "Shows maximum missile, super missile and power bomb capacity on pause screens."
group = "HUD"
default_enabled = false
presentation_only = true

[[plugin]]
feature = "ammo-totals"
id = "super-metroid.map-hud.ammo-totals"

[[feature]]
id = "laser-sight"
name = "Laser sight"
description = "A red sight line shows where shots will go while Samus aims diagonally, Metroid Prime style. It stops at the first solid block."
group = "HUD"
default_enabled = false
presentation_only = true

[[option]]
feature = "laser-sight"
id = "when"
label = "Show"
description = "Only while aiming diagonally with the shoulder buttons, or in every direction Samus can shoot."
type = "choice"
default = "diagonal"
[[option.choice]]
value = "diagonal"
label = "Diagonal aim"
[[option.choice]]
value = "always"
label = "Always"

[[plugin]]
feature = "laser-sight"
id = "super-metroid.map-hud.laser-sight"

[[feature]]
id = "reveal-map"
name = "Reveal whole map"
description = "Every area's map is shown on the pause screen and minimap as if you had used its map station. Your exploration progress is kept. From the Super Metroid Redux widescreen bonus patches."
group = "Map"
default_enabled = false

[[option]]
feature = "reveal-map"
id = "secrets"
label = "Secret rooms"
description = "Also show rooms the map stations leave out."
type = "choice"
default = "hidden"
[[option.choice]]
value = "hidden"
label = "Hidden"
[[option.choice]]
value = "shown"
label = "Shown"

[[plugin]]
feature = "reveal-map"
id = "super-metroid.map-hud.reveal-map"

[[feature]]
id = "pause-map"
name = "Clear pause map"
description = "Door weapon colours and symbols, one-way arrows, station labels and uncollected-item rings on a dense grid. D-pad scrolls; L/R keep the normal pause tabs. Inspired by Zero Mission and Falcon Zero's complete Zebes map."
group = "Map"
default_enabled = false

[[plugin]]
feature = "pause-map"
id = "super-metroid.map-hud.pause-map"

[[feature]]
id = "world-map"
name = "Zoomable Zebes map"
description = "Press X on the pause map to see all of Zebes. L/R zoom, D-pad pans, Y centres Samus, and X/B returns. Undiscovered places stay hidden unless Reveal map is enabled."
group = "Map"
default_enabled = false

[[plugin]]
feature = "world-map"
id = "super-metroid.map-hud.world-map"

[[feature]]
id = "minimap"
name = "Map over gameplay"
description = "Select+Start toggles a map over the game. Choose a live background or pause it while the map is open. Netplay always keeps the background live."
group = "Map"
default_enabled = false

[[option]]
feature = "minimap"
id = "background"
label = "Background"
type = "choice"
default = "live"
[[option.choice]]
value = "live"
label = "Keep playing"
[[option.choice]]
value = "paused"
label = "Pause while open (offline)"

[[option]]
feature = "minimap"
id = "size"
label = "Map size"
type = "choice"
default = "small"
[[option.choice]]
value = "small"
label = "Compact"
[[option.choice]]
value = "large"
label = "Wide"

[[plugin]]
feature = "minimap"
id = "super-metroid.map-hud.minimap"
