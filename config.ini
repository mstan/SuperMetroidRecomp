[General]
# Run-ahead: frames of local input-latency hiding (0 = off, 1 = usual). Each
# adds a full emulated frame plus a snapshot per displayed frame; offline only.
RunAhead = 0
Autosave = 0
DisableFrameDelay = 0
# Oracle-build only. Leave at false for MMX investigations: freeze repros
# load a save state to reach the scene, but the snes9x oracle starts from
# boot and cannot follow save-state loads, so any recomp-vs-oracle
# comparison diffs two unrelated game moments. A prior session burned
# real time chasing false "divergences" that turned out to be content
# mismatch. Re-enabling this without first adding save-state-aware
# oracle (or input-record/replay parity) is NOT a fix — see header doc
# in snes_oracle_backend.h and the startup stderr warning.
EnableSnes9xOracle = false

[Graphics]
# Presentation options the launcher's Display page also edits.
# FrameBlend: average each presented frame with the previous one, so
# alternate-frame flicker reads as translucency (costs half a frame of ghosting).
FrameBlend = 0
# VSync: driver vsync at present time. Off = immediate swap, lowest latency.
VSync = 1
# Renderer: auto (SDL's pick), opengl (the native GL presenter with GLSL
# presets), software, or an SDL render driver such as vulkan. Empty follows
# OutputMethod.
Renderer = auto
# OpenGL GLSL preset path, edited by the launcher's shader dropdown.
Shader =
# A fresh window starts wide; Fit continues adapting when it is resized.
WindowSize = 960x540
Fullscreen = 0
WindowScale = 3
NewRenderer = 1
IgnoreAspectRatio = 0
NoSpriteLimits = 1

[Sound]
# 0..100; VolumeUp / VolumeDown (Keypad + / -) move it in 5% steps and show a bar.
Volume = 100
EnableAudio = 1
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 512

[KeyMap]
# Every hotkey the game responds to is listed here and rebindable.
# Prefix with Shift+/Ctrl+/Alt+ as needed; SDL key names (F1, Tab, p, ...).
# Leave a value empty to unbind the hotkey entirely (e.g. "DisplayPerf =").
Fullscreen = Alt+Return
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down
VolumeUp = Keypad +
VolumeDown = Keypad -
# Toggle the FPS/perf readout (in-window or title bar).
DisplayPerf = f
# Switch between the old and new PPU renderer at runtime.
ToggleRenderer = r
Load =      F1,     F2,     F3,     F4,     F5,     F6,     F7,     F8,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10
# In-game overlays (framework modules). The save-state browser also opens
# with Select+R on the pad; rewind with [Controller] RewindGesture below.
SaveStateMenu = F11
Rewind = Shift+F12
# OpenGL framebuffer capture, saved under screenshots/.
Screenshot = F12

[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = true
# Analog stick deadzone (raw axis units, range 1-32767).
# 3277 ~ 10% deflection, which is what the launcher's Deadzone slider shows.
# Raise it if an idle stick drifts into movement. A file still carrying the
# former default of 10000 (30%) is read as 3277 and rewritten once.
GamepadDeadzone = 3277
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
